<!DOCTYPE html>
<html lang="en">

<head>
    <title>سرديّة</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP is defined in manifest.json (content_security_policy.extension_pages),
         the MV3-canonical location. Fonts are self-hosted (see styles.css @font-face);
         no CDN / remote resources are loaded. -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <div class="plugin-window" id="plugin-window">

        <!-- start header section -->
        <header class="header" id="header">
            <div class="header-text" id="header-text">
                <img src="images/logo.svg" alt="logo for sardiyah" width="auto" height="27">
            </div>
            <div class="toggle">
                <span class="toggle-label" id="toggle-label"></span>
                <label class="switch" for="toggleSwitch">
                    <input type="checkbox" id="toggleSwitch">
                    <span class="slider round"></span>
                </label>
            </div>
        </header>
        <!-- end header section -->

        <!-- Safari-only onboarding: shown by popup.js when running as a Safari
             Web Extension and not yet dismissed. Safari does not silently honor
             host_permissions — the user must grant "Allow on Every Website". -->
        <section class="safari-onboarding" id="safari-onboarding" style="display: none;">
            <h2 class="safari-onboarding-title" id="safari-onboarding-title"></h2>
            <p class="safari-onboarding-body" id="safari-onboarding-body"></p>
            <button class="safari-onboarding-dismiss" id="safari-onboarding-dismiss" type="button"></button>
        </section>

        <!-- start content section -->
        <section class="content" id="content">

            <!-- Off-state banner: shown live (renderState) when ext_on === false.
                 Replacement reverts in place with no reload, so the copy does NOT
                 tell the user to reload. -->
            <div class="off-banner" id="off-banner" style="display:none">
                <span class="off-banner-icon" aria-hidden="true">⏸</span>
                <span id="off-banner-text"></span>
            </div>

            <div class="title-row">
                <h1 class="replaced-words-title" id="replaced-words-title">Names on this page</h1>
                <button class="add-button" id="edit-button" type="button">
                    <img src="images/add.svg" alt="suggest a name">
                </button>

                <select class="lang-select" id="language-select" aria-label="Language">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
            <p class="replaced-words-subtitle" id="replaced-words-subtitle"></p>

            <!-- Empty / first-open state: shown (renderState) when the active tab
                 replaced no names — the default on pages with no matches or pages
                 Sardiya can't read (chrome://, store pages). -->
            <div class="empty-state" id="empty-state" style="display:none">
                <div class="empty-mark" aria-hidden="true">◈</div>
                <h2 class="empty-title" id="empty-title"></h2>
                <p class="empty-body" id="empty-body"></p>
                <button class="empty-suggest" id="empty-suggest" type="button"></button>
            </div>

            <div class="table-container" id="table-container">
                <table class="replaced-words-table">
                    <tbody id="table-body">
                        <!-- Rows added programmatically: occupier name → original name -->
                    </tbody>
                </table>
            </div>

            <!-- start footer section -->
            <footer id="footer">
                <p>© <time id="footer-year">2026</time> <span dir="rtl">سرديّة</span></p>
            </footer>
            <!-- end footer section -->
        </section>
        <!-- end content section -->

        <!-- start welcome section: first-run onboarding only (welcomeSeen flag) -->
        <section class="welcome" id="welcome" style="display:none">
            <img src="images/welcome.svg" alt="welcome to Sardiya" width="100%" height="auto">
            <button class="welcome-continue" id="welcome-continue" type="button"></button>
        </section>
        <!-- end welcome section -->

        <!-- start suggest-a-name dialog -->
        <section id="input-dialog" class="input-dialog" style="display:none">
            <div class="dialog-content">
                <h2 class="dialog-title" id="dialog-title"></h2>
                <form id="input-form">

                    <div class="formStyle">
                        <label for="word-input" id="word-label"></label>
                        <input type="text" name="word" id="word-input" placeholder="The word you want to replace"
                            required>

                        <label for="replacement-input" id="replacement-label"></label>
                        <input type="text" name="replacement" id="replacement-input" placeholder="The replacement for the word"
                         required>
                    </div>

                    <div class="error-message" id="error-message">
                        <span class="error-icon"></span>
                        <span id="error-text"></span>
                    </div>

                    <div class="dialog-buttons">
                        <button class="dialog-submit" id="dialog-submit" type="submit">Save</button>
                        <button class="dialog-close" id="dialog-close" type="button">Cancel</button>
                    </div>
                </form>

                <!-- Suggestion confirmation: replaces the old optimistic table row.
                     The "+" submits a community suggestion, it does not create a
                     local replacement, so we confirm honestly instead of faking a row. -->
                <div class="suggest-confirm" id="suggest-confirm" style="display:none">
                    <span class="suggest-confirm-icon" aria-hidden="true">✓</span>
                    <p id="suggest-confirm-text"></p>
                    <button class="suggest-confirm-close" id="suggest-confirm-close" type="button"></button>
                </div>

                <div id="loading-indicator" style="display: none;">
                    <span class="loader"></span>
                </div>
            </div>
        </section>
        <!-- end suggest-a-name dialog -->

    </div>

    <script src="src/track-client.js"></script>
    <script src="src/popup-core.js"></script>
    <script src="popup.js"></script>

</body>

</html>
